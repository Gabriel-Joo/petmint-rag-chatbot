# 문서 규칙(FOREMAN 문서 도구가 읽는다, tools/docs.py). 없는 칸은 FOREMAN 기본값. 본은 런슈즈 .foreman/docs.toml
# 2026-11-19 펫퍼민트 문서 정리 A단계(현황과 근거 달기)에서 넣었다. 원고는 지금 docs/ 뿐이다(notion/, portfolio/ 는 D, E단계)
records = ["log/", "docs/ops/", "docs/archive/", "backups/"]   # 기록 폴더. log/ 는 점검 기록, docs/ops/ 는 배포기록, 모드검증, 저녁실행(운영 기록과 체크리스트, 노션 게시에서도 빠져 있다), backups/ 는 되돌리기 안내(2026-11-19 문서가 인용해 올림), docs/archive/ 는 문서 정리 B단계에서 본문에서 떼어 낸 구현 기록과 처음 설계(2026-11-19, 런슈즈와 같은 이름)
pair_numbers = false
read_commit = "piece"                 # 읽은 커밋은 편마다 따로
allowed_domains = ["ronanlab.dev"]
# 바뀌어도 코드로 세지 않는 것: 글, 그림, 잠금 파일, 빌드와 도구 설정, 세션 설정, 평가와 검수 기록(data/review/, docs/README.md 「근거」)
not_code = [".md", ".png", ".jpg", ".svg", ".lock", "*package-lock.json", "*package.json", "*tsconfig*.json", "*vite.config.ts",
            ".gitignore", "*/.gitignore", ".claude/*", ".foreman/*", "data/review/*",
            "models/gguf/Modelfile.*",   # Ollama 모델 등록 설정(2026-11-19 문서가 인용해 올림). 원자료처럼 다루고 07번이 근거로 건다
            "data/search_experiments.py"]   # 다른 세션이 남긴 추적 안 하는 파일. 우리 파일이 아니라 고치거나 지우지 않고 줄표 검사에서만 뺀다(2026-11-19 사람 결정)

[sets]
docs = "docs/"
notion = "notion/"                    # 사람이 읽는 노션 기술문서 원고(2026-11-19 문서 정리 D단계에서 새로 씀). 차례는 docs/manuscript_guide.md 1절

[check]
sets = ["docs", "notion", "portfolio"]  # portfolio/ 는 FOREMAN 기본 묶음(런슈즈와 같다). 포트폴리오 원고 아홉 편(2026-11-19 문서 정리 E단계)
numbered_only = []                    # 번호 없는 편(README, requirements, pipeline, TODO, next_rebuild)도 본다
head_at = "top"
fenced = true
kinds = ["c", "docs", "code"]
files_at = "read"
claim = '\d|“|”'
claim_min = 0
banned = ["notion", "portfolio"]      # 금지어(IP, 도메인, 홈 경로, 토큰 꼴, 포트)는 사람이 읽는 원고에만 건다. docs는 내부 주소를 써도 된다
cover_by = ["docs"]
code_doc_base = "0439eb4d0221430c4b36eae7575c355804357826"  # .md 문서를 [code:]로 가리킨 새 줄만 틀림으로 센다. 검사가 들어온 때의 펫퍼민트 origin/main(2026-11-20). 옛 줄 282곳(대부분 KNOWN_ISSUES.md, data/review)은 의심으로 둔다(관리자 판단, FOREMAN 안내의 가)
dashdot_base = "261913e"              # 새 줄 em dash와 가운뎃점 검사의 기준 커밋. 넣은 때의 펫퍼민트 main(2026-11-19). 기존 줄은 C단계에서
