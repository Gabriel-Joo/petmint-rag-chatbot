# 초기화 Job — 앱 이미지로 돈다(초기화용 이미지를 따로 만들지 않는다, 14번 1-7절). 여러 번 돌려도 같다.
#   1. db.bootstrap            데이터베이스(petmint, insurance_core)와 계정. petmint_app은 insurance_core에 SELECT만
#   2. db.migrate              petmint 스키마
#   3. db.migrate insurance_core
#   4. db.seed_insurance_core  --if-empty: 원장이 비어 있을 때만 픽스처를 깐다(sync마다 원장이 되돌아가지 않게)
# 순서 보장: ArgoCD에서는 Sync hook(wave 1)이라 MySQL(wave 0) 다음, 앱(wave 2) 전에 끝까지 돈다.
# kubectl apply로 직접 적용할 때는 앱 Pod의 initContainer(db.wait_ready)가 이 Job의 결과를 기다린다.
apiVersion: batch/v1
kind: Job
metadata:
  name: petmint-init-db
  labels:
    app.kubernetes.io/name: petmint-init-db
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 10                  # 첫 배포에서는 MySQL이 뜨기 전에 시작할 수 있다 — 재시도로 기다린다
  ttlSecondsAfterFinished: 86400    # 끝난 Job을 하루 뒤 지운다 — 다시 apply하면 새로 돈다(Job 템플릿은 바꿀 수 없다)
  template:
    metadata:
      labels:
        app.kubernetes.io/name: petmint-init-db
    spec:
      restartPolicy: Never
      imagePullSecrets:                # 앱과 같은 이미지라 같은 pull Secret(Harbor petmint 프로젝트는 private)
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: init-db
          image: harbor.ronanlab.dev/petmint/petmint-app   # 태그는 kustomization images가 붙인다
          command:
            - sh
            - -c
            - >-
              python -m db.bootstrap &&
              python -m db.migrate &&
              python -m db.migrate --app insurance_core &&
              python -m db.seed_insurance_core --if-empty --fixture /var/lib/petmint/fixtures/customers.json
          envFrom:
            - configMapRef: { name: petmint-app-config }
            - configMapRef: { name: petmint-init-config }
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-root, key: MYSQL_ROOT_PASSWORD } }
            - name: PETMINT_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: petmint-db, key: password } }
            - name: PETMINT_CORE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: petmint-db, key: password } }
            - name: INSURANCE_SEED_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: insurance-seed-db, key: password } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/petmint
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: petmint-data
            readOnly: true
