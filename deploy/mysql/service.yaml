# headless — StatefulSet Pod 하나(mysql-0)를 이름 "mysql"로 찾는다. 클러스터 밖으로 열지 않는다
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
