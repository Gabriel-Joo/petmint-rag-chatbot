# MySQL 인스턴스 하나에 데이터베이스를 나눈다(12번 1-3절): petmint, insurance_core, 나중에 runshoes.
# 데이터베이스·계정은 초기화 Job(db.bootstrap)이 만든다. 여기서는 root 비밀번호만 Secret으로 받는다.
# PVC는 StatefulSet이나 Pod를 지워도 남는다(Retain) — 데이터를 지우려면 PVC를 직접 지운다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
    spec:
      terminationGracePeriodSeconds: 60      # InnoDB가 정상 종료할 시간
      securityContext:
        fsGroup: 999                          # mysql 이미지의 mysql 사용자
      containers:
        - name: mysql
          image: mysql:8.0.46                 # 개발 호스트와 같은 버전으로 박는다
          args:
            - --innodb-buffer-pool-size=256M  # 워커 VM이 4GB — 기본값(128M)보다 조금만 키운다
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_0900_ai_ci
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-root
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - name: mysql
              containerPort: 3306
          # mysqladmin ping은 인증 없이도 서버가 응답하면 0을 돌려준다 — 비밀번호를 프로세스 인자에 남기지 않는다
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
