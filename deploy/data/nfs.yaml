# 약관(chunks, graph)과 고객 시드 픽스처 — 이미지에 없다(14번 1-2절). 호스트(GPU 머신, 192.168.122.1)의 리포 디렉터리를
# NFS로 읽기 전용 공유한 것을 그대로 붙인다. 호스트 설정은 scripts/host-nfs-setup.sh(sudo, 사용자가 돌린다).
#   /srv/nfs/petmint/chunks   ← 리포 data/chunks    (앱)
#   /srv/nfs/petmint/graph    ← 리포 data/graph     (앱)
#   /srv/nfs/petmint/fixtures ← 리포 app/fixtures   (초기화 Job의 시드만 읽는다. 앱은 붙이지 않는다)
# 복사본이 없다 — Milvus 색인을 만든 그 파일을 앱이 읽는다(드리프트 없음). 앱은 기동 때 읽으므로 바꾼 뒤에는
# kubectl -n petmint rollout restart deploy/petmint-app.
# ReadOnlyMany라 어느 노드에서든 붙는다(앱 replicas 2, 노드 분산). 읽기 전용은 세 겹이다:
# 호스트 export(ro) · PV(readOnly, mountOptions ro) · Pod volumeMount(readOnly).
# PV는 클러스터 범위다 — 지워도(Retain) 호스트 파일은 그대로다. claimRef로 이 네임스페이스의 PVC에만 묶는다.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: petmint-chunks
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  capacity: { storage: 1Gi }          # NFS는 용량을 강제하지 않는다 — 바인딩용 표시
  accessModes: ["ReadOnlyMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef: { namespace: petmint, name: petmint-chunks }
  mountOptions: ["nfsvers=4.2", "ro"] # v4만 연다(호스트는 v3를 끈다 — rpcbind·mountd 포트가 필요 없다)
  nfs: { server: 192.168.122.1, path: /srv/nfs/petmint/chunks, readOnly: true }
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: petmint-graph
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  capacity: { storage: 1Gi }
  accessModes: ["ReadOnlyMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef: { namespace: petmint, name: petmint-graph }
  mountOptions: ["nfsvers=4.2", "ro"]
  nfs: { server: 192.168.122.1, path: /srv/nfs/petmint/graph, readOnly: true }
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: petmint-fixtures
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  capacity: { storage: 1Gi }
  accessModes: ["ReadOnlyMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef: { namespace: petmint, name: petmint-fixtures }
  mountOptions: ["nfsvers=4.2", "ro"]
  nfs: { server: 192.168.122.1, path: /srv/nfs/petmint/fixtures, readOnly: true }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: petmint-chunks
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes: ["ReadOnlyMany"]
  storageClassName: ""                # 기본 StorageClass(local-path)가 동적으로 만들지 않게
  volumeName: petmint-chunks
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: petmint-graph
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes: ["ReadOnlyMany"]
  storageClassName: ""
  volumeName: petmint-graph
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: petmint-fixtures
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes: ["ReadOnlyMany"]
  storageClassName: ""
  volumeName: petmint-fixtures
  resources: { requests: { storage: 1Gi } }
