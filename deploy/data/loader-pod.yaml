# 약관·시드 적재용 임시 Pod — kustomization에 넣지 않는다. scripts/load-data.sh가 띄우고 kubectl cp로 넣은 뒤 지운다.
# 앱·Job이 같은 볼륨을 읽기 전용으로 붙이므로, 쓰기는 이 Pod만 한다
apiVersion: v1
kind: Pod
metadata:
  name: petmint-data-loader
  namespace: petmint
  labels:
    app.kubernetes.io/name: petmint-data-loader
    app.kubernetes.io/part-of: petmint
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 10001          # 앱과 같은 uid — 앱이 읽을 수 있게
    runAsGroup: 10001
    fsGroup: 10001
  containers:
    - name: loader
      image: busybox:1.36.1     # kubectl cp에 tar가 필요하다
      command: ["sh", "-c", "mkdir -p /data/chunks /data/graph /data/fixtures && sleep 3600"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 64Mi }
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: petmint-data
