# petmint.ronanlab.dev — Cloudflare 터널 → nginx-ingress → 이 Service(13번 1-1절). TLS는 Cloudflare 엣지에서 끝난다.
# WebSocket(/ws/chat): ingress-nginx는 Upgrade를 기본으로 넘기지만 프록시 읽기·쓰기 제한(기본 60초)에 걸리면 끊긴다.
# 한 상담이 길게 이어지므로 1시간으로 둔다. 그 사이 연결은 uvicorn이 20초마다 보내는 ping으로 살아 있다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: petmint-app
  labels:
    app.kubernetes.io/name: petmint-app
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"          # 터널이 https로 들어온다 — 다른 호스트(harbor 등)와 같다
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"         # 스트리밍 응답을 모아 두지 않는다
spec:
  ingressClassName: nginx
  rules:
    - host: petmint.ronanlab.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: petmint-app
                port:
                  name: http
